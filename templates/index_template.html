<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP Tips</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #333;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #007BFF; text-align: center; }
        ul { list-style-type: none; padding: 0; }
        li { margin-bottom: 10px; padding: 10px; background-color: #f8f9fa; border-radius: 5px; }
        a { color: #007BFF; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .pagination a, .pagination span {
            margin: 0 5px;
            padding: 5px 10px;
            border: 1px solid #007BFF;
            border-radius: 3px;
        }
        .pagination .current {
            background-color: #007BFF;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>PHP Tips</h1>
    <ul>
        {% for tip in tips %}
        <li><a href="{{ tip.permalink }}">{{ tip.summary }}</a></li>
        {% endfor %}
    </ul>
    <div class="pagination">
        {% if has_prev %}
        <a href="{% if current_page == 2 %}/index.html{% else %}/pages/page_{{ current_page - 1 }}.html{% endif %}">Previous</a>
        {% endif %}

        {% for page in range(1, total_pages + 1) %}
        {% if page == current_page %}
        <span class="current">{{ page }}</span>
        {% else %}
        <a href="{% if page == 1 %}/index.html{% else %}/pages/page_{{ page }}.html{% endif %}">{{ page }}</a>
        {% endif %}
        {% endfor %}

        {% if has_next %}
        <a href="/pages/page_{{ current_page + 1 }}.html">Next</a>
        {% endif %}
    </div>
</div>
</body>
</html>
