<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP Tip of the Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #007BFF;
        }

        h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #555;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }

        .button:hover {
            background-color: #0056b3;
        }

        pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
            text-align: left;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            background-color: #f4f4f4;
            padding: 2px 4px;
            border-radius: 3px;
        }

        pre code {
            background-color: transparent;
            padding: 0;
        }
    </style>
    <script>
      async function displayRandomTip() {
        try {
          const response = await fetch('tips.json');
          const tips = await response.json();
          const randomTip = tips[Math.floor(Math.random() * tips.length)];

          document.getElementById('tip-summary').innerHTML = formatText(randomTip.summary);
          document.getElementById('tip-content').innerHTML = formatText(randomTip.content);
        } catch (error) {
          console.error('Error fetching tips:', error);
        }
      }

      function formatText(textContent) {
        return textContent
          .replace(/```php([\s\S]*?)```/g, '<pre><code class="language-php">$1</code></pre>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\n/g, '<br>');
      }

      window.onload = displayRandomTip;

      function refreshTip() {
        displayRandomTip();
      }
    </script>
</head>
<body>
<div class="container">
    <h1>PHP Tip of the Day</h1>
    <h2 id="tip-summary"></h2>
    <p id="tip-content"></p>
    <button class="button" onclick="refreshTip()">Show Another Tip</button>
    <a href="list/index.html" class="button">View All Tips</a>
    <footer>&copy; 2024 PHP Tips. All rights reserved.</footer>
</div>
</body>
</html>
