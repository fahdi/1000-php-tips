<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP Tip Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/themes/prism-okaidia.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/plugins/autoloader/prism-autoloader.min.js"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #333;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #007BFF;
        }

        pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #007BFF;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 id="tipTitle"></h1>
    <div id="tipContent"></div>
    <a href="/list/" class="back-link">← Back to Tips List</a>
</div>

<script>
  function formatText(text) {
    let formattedText = text;

    // First, replace code blocks
    formattedText = formattedText.replace(/```php([\s\S]*?)```/g, function(match, code) {
      return '<pre><code class="language-php">' + code.trim() + '</code></pre>';
    });

    // Then, replace inline code
    formattedText = formattedText.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Finally, replace newlines outside of code blocks
    formattedText = formattedText.split(/(<pre><code.*?>[\s\S]*?<\/code><\/pre>)/).map(part => {
      return part.startsWith('<pre><code') ? part : part.replace(/\n/g, '<br>');
    }).join('');

    return formattedText;
  }

  async function loadTipDetail() {
    const urlParams = new URLSearchParams(window.location.search);
    const tipId = urlParams.get('id');

    try {
      const response = await fetch('../tips.json');
      const tips = await response.json();
      const tip = tips.find(t => t.id === parseInt(tipId));

      if (tip) {
        document.getElementById('tipTitle').textContent = tip.summary;
        document.getElementById('tipContent').innerHTML = formatText(tip.content);
        Prism.highlightAll();
      } else {
        document.getElementById('tipTitle').textContent = 'Tip Not Found';
      }
    } catch (error) {
      console.error('Error loading tip:', error);
    }
  }

  window.onload = loadTipDetail;
</script>

</body>
</html>
